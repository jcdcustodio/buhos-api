[project]
name = "buhos-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.162.0",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "shap==0.54.1",
    "tqdm==4.70.1",
    "uvicorn==0.54.0",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
handcalcs = [
    "forallpeople>=3.4.0",
    "handcalcs>=1.11.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "requests==2.34.2",
]

[tool.uv]
python-preference = "system"
default-groups = "all"
