[project]
name = "buhos-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]==0.162.0",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
    "xgboost==3.4.1",
]

[tool.uv]
python-preference = "managed"
default-groups = "all"
